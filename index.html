<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XCY WhatsApp Bot</title>
  <style>
    :root {
      --ios-bg: #000000;
      --ios-card: #1c1c1e;
      --ios-card-inner: #2c2c2e;
      --ios-blue: #0a84ff;
      --ios-green: #30d158;
      --ios-text: #ffffff;
      --ios-secondary: #8e8e93;
      --ios-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--ios-bg); color: var(--ios-text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .ios-card { width: 100%; max-width: 420px; background: var(--ios-card); border-radius: 24px; padding: 24px; backdrop-filter: blur(20px); border: 1px solid var(--ios-border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

    .header { text-align: center; margin-bottom: 24px; }
    .header img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 12px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    .header p { font-size: 0.85rem; color: var(--ios-secondary); margin-top: 4px; }

    .group { background: var(--ios-card-inner); border-radius: 16px; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--ios-border); }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--ios-border); }
    .row:last-child { border-bottom: none; }
    .row label { font-size: 0.95rem; font-weight: 400; color: var(--ios-text); }

    select, input[type="text"] { background: transparent; border: none; color: var(--ios-blue); font-size: 0.95rem; text-align: right; outline: none; width: 60%; }
    input[type="text"]::placeholder { color: var(--ios-secondary); }

    .ios-btn { width: 100%; background: var(--ios-blue); color: #fff; font-size: 1rem; font-weight: 600; padding: 14px; border-radius: 14px; border: none; cursor: pointer; transition: all 0.2s ease; }
    .ios-btn:active { opacity: 0.7; transform: scale(0.98); }

    .hidden { display: none !important; }

    /* iOS Spinner Loading */
    .spinner-box { text-align: center; padding: 20px 0; }
    .ios-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.15); border-radius: 50%; border-top-color: var(--ios-blue); animation: spin 0.8s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Display Code / QR */
    .code-box { font-size: 2rem; font-weight: 700; text-align: center; letter-spacing: 6px; color: var(--ios-green); padding: 16px; background: var(--ios-card-inner); border-radius: 16px; margin-top: 16px; border: 1px solid var(--ios-border); }
    .qr-box { text-align: center; margin-top: 16px; }
    .qr-box img { width: 220px; height: 220px; border-radius: 20px; border: 4px solid var(--ios-card-inner); }

    /* Dropdown File Session iOS Style */
    .dropdown-btn { background: var(--ios-card-inner); color: var(--ios-text); font-size: 0.95rem; font-weight: 500; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--ios-border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .dropdown-content { display: none; background: var(--ios-card-inner); border-radius: 16px; margin-top: 8px; padding: 12px; max-height: 180px; overflow-y: auto; border: 1px solid var(--ios-border); }
    .dropdown-content.show { display: block; }
    .file-item { padding: 8px 4px; border-bottom: 1px solid var(--ios-border); font-size: 0.85rem; color: var(--ios-secondary); display: flex; align-items: center; gap: 8px; }
    .file-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="ios-card">
  <div class="header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA Logo">
    <h1>XCY WhatsApp Bot</h1>
    <p>Sistem Tautan Perangkat iOS</p>
  </div>

  <!-- PAIRING / QR FORM -->
  <div id="pairSection">
    <div class="group">
      <div class="row">
        <label>Metode Koneksi</label>
        <select id="modeSelect" onchange="toggleModeInput()">
          <option value="pairing">Pairing Code</option>
          <option value="qr">QR Code</option>
        </select>
      </div>
      <div class="row" id="phoneInputGroup">
        <label>Nomor HP</label>
        <input type="text" id="phoneInput" placeholder="628xxx">
      </div>
    </div>

    <button id="startBtn" class="ios-btn" onclick="startConnection()">Mulai Tautan</button>

    <!-- LOADING REALTIME -->
    <div id="loadingBox" class="spinner-box hidden">
      <div class="ios-spinner"></div>
      <p style="font-size: 0.85rem; color: var(--ios-secondary); margin-top: 10px;">Menghubungkan ke Server...</p>
    </div>

    <!-- CODE DISPLAY -->
    <div id="codeDisplay" class="hidden">
      <p style="font-size: 0.85rem; color: var(--ios-secondary); text-align: center;">Kode Pairing WhatsApp Anda:</p>
      <div id="pairCode" class="code-box">------</div>
    </div>

    <!-- QR DISPLAY -->
    <div id="qrDisplay" class="qr-box hidden">
      <p style="font-size: 0.85rem; color: var(--ios-secondary); margin-bottom: 10px;">Pindai QR ini melalui kamera WhatsApp:</p>
      <img id="qrImage" src="" alt="QR Code">
    </div>
  </div>

  <!-- DASHBOARD TERTAUT -->
  <div id="dashboardSection" class="hidden">
    <div class="group">
      <div class="row">
        <label>Status Server</label>
        <span style="color: var(--ios-green); font-weight: 600; font-size: 0.95rem;">● Connected</span>
      </div>
      <div class="row">
        <label>Nomor HP</label>
        <span id="connectedNum" style="color: var(--ios-secondary); font-size: 0.95rem;">-</span>
      </div>
    </div>

    <div class="dropdown-btn" onclick="toggleMenu()">
      <span>Session File System</span>
      <span style="color: var(--ios-secondary);">⋮</span>
    </div>
    
    <div id="menuContent" class="dropdown-content">
      <div id="fileList">Memuat file...</div>
    </div>
  </div>
</div>

<script>
  // MASUKKAN URL CLOUDFLARE TUNNEL TERMUX DI SINI
  const BACKEND_URL = "https://ganti-pake-url-cloudflared-kamu.trycloudflare.com";

  let ws = null;

  function initWebSocket() {
    if (!BACKEND_URL) return;
    const wsUrl = BACKEND_URL.replace(/^http/, 'ws');
    
    ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'pairing_code') {
        hideLoading();
        document.getElementById('codeDisplay').classList.remove('hidden');
        document.getElementById('pairCode').innerText = data.code;
      } else if (data.type === 'qr_code') {
        hideLoading();
        document.getElementById('qrDisplay').classList.remove('hidden');
        document.getElementById('qrImage').src = data.qr;
      } else if (data.type === 'status') {
        checkStatus();
      }
    };
  }

  function toggleModeInput() {
    const mode = document.getElementById('modeSelect').value;
    const phoneGroup = document.getElementById('phoneInputGroup');
    if (mode === 'qr') {
      phoneGroup.classList.add('hidden');
    } else {
      phoneGroup.classList.remove('hidden');
    }
  }

  async function startConnection() {
    const mode = document.getElementById('modeSelect').value;
    const phone = document.getElementById('phoneInput').value;

    if (mode === 'pairing' && !phone) return alert('Silakan masukkan nomor WhatsApp!');

    showLoading();

    try {
      const res = await fetch(`${BACKEND_URL}/api/connect`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, phone })
      });
      
      const result = await res.json();
      if (result.error) {
        hideLoading();
        alert(result.error);
      }
    } catch (err) {
      hideLoading();
      alert('Gagal terhubung ke Server Termux!');
    }
  }

  function showLoading() {
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('loadingBox').classList.remove('hidden');
    document.getElementById('codeDisplay').classList.add('hidden');
    document.getElementById('qrDisplay').classList.add('hidden');
  }

  function hideLoading() {
    document.getElementById('loadingBox').classList.add('hidden');
    document.getElementById('startBtn').classList.remove('hidden');
  }

  async function checkStatus() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/status`);
      const data = await res.json();

      if (data.connected) {
        document.getElementById('pairSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('connectedNum').innerText = `+${data.number}`;
        loadSessionFiles();
      } else {
        document.getElementById('pairSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
      }
    } catch (err) {
      console.error(err);
    }
  }

  function toggleMenu() {
    document.getElementById('menuContent').classList.toggle('show');
  }

  async function loadSessionFiles() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/session-files`);
      const data = await res.json();
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';

      if (data.files.length === 0) {
        listEl.innerHTML = '<div class="file-item">Tidak ada file session.</div>';
        return;
      }

      data.files.forEach(file => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `📄 <span>${file}</span>`;
        listEl.appendChild(item);
      });
    } catch (err) {
      console.error(err);
    }
  }

  initWebSocket();
  checkStatus();
</script>

</body>
</html>
